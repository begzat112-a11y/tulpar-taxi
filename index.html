<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111817">
<title>Tulpar — карта и такси</title>
<link rel="stylesheet" href="style.css">
<script src="https://mapgl.2gis.com/api/js/v1"></script>
<script src="https://unpkg.com/@2gis/mapgl-directions@^2/dist/directions.js"></script>
</head>
<body><main id="app">
<div id="map"></div>
<header class="topbar"><button id="miniBrand" class="brand"><span class="brand-mark">✦</span><span><b>TULPAR</b><small>карта • такси</small></span></button></header>
<div class="map-title">✦ Бишкек</div>
<div class="map-actions"><button id="locateBtn">⌖</button><button id="zoomInBtn">+</button><button id="zoomOutBtn">−</button></div>
<div id="toast" class="toast hidden"></div>

<section id="routeSheet" class="sheet collapsed">
<div id="sheetHandle" class="grab-area"><div class="grab"></div></div>
<div class="sheet-head"><div><div class="eyebrow">TULPAR • ЖОЛ</div><h1 id="sheetTitle">Куда едем?</h1></div><button id="closeRouteBtn" class="small-close hidden">×</button></div>

<div class="search-wrap"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Адрес, место или организация"><button id="clearSearch" class="icon-btn hidden">×</button><div id="suggestions" class="suggestions hidden"></div></div>

<div class="places">
<button id="fromRow" class="place-row"><i class="dot from-dot"></i><span><small>ОТКУДА</small><b id="fromText">Моё местоположение</b></span>›</button>
<div class="route-line"></div>
<button id="toRow" class="place-row"><i class="dot to-dot"></i><span><small>КУДА</small><b id="toText">Выберите место или найдите его</b></span>›</button>
</div>

<div class="quick-places"><button data-slot="home">⌂ Дом</button><button data-slot="work">▣ Работа</button><button id="pickOnMapBtn">⌖ На карте</button></div>

<div class="mode-tabs"><button class="mode active" data-mode="car">🚕 Машина</button><button class="mode" data-mode="walk">🚶 Пешком</button></div>
<div id="routeVariants" class="route-variants hidden"></div>
<div id="routeInfo" class="route-info hidden"><div><b id="routeTime">—</b><small>в пути</small></div><i></i><div><b id="routeDistance">—</b><small>расстояние</small></div></div>

<div id="tariffs" class="tariffs hidden"><label>ВЫБЕРИТЕ ТАРИФ</label>
<button class="tariff active" data-type="economy"><span>🚕</span><strong>Эконом<small>быстро и доступно</small></strong><b id="economyPrice">—</b></button>
<button class="tariff" data-type="comfort"><span>🚘</span><strong>Комфорт<small>больше пространства</small></strong><b id="comfortPrice">—</b></button>
<button class="tariff" data-type="premium"><span>⭐</span><strong>Premium<small>особый уровень Tulpar</small></strong><b id="premiumPrice">—</b></button></div>

<button id="orderBtn" class="primary-btn" disabled><b>Заказать Tulpar</b><b>→</b></button>
<div class="ornament">✦ ─── <b>TULPAR</b> ─── ✦</div>
</section>

<div id="pickHint" class="pick-hint hidden"><span>Нажмите на карту, чтобы выбрать точку</span><button id="cancelPickBtn">Отмена</button></div>
<div id="loader" class="loader"><div><div class="loader-mark">✦</div><b>TULPAR</b><small>Загружаем карту…</small></div></div>
</main><script src="app.js"></script></body></html>
