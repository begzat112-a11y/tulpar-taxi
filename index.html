<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulpar Taxi</title>
<link rel="stylesheet" href="style.css">
<script src="https://mapgl.2gis.com/api/js/v1"></script>
</head>
<body>
<header class="topbar"><b>🐎 Tulpar</b><span>Такси и навигация</span></header>
<main>
<section class="panel">
<label>Откуда<input id="fromInput" placeholder="Нажмите точку на карте"></label>
<label>Куда<input id="toInput" placeholder="Нажмите точку на карте"></label>
<div class="buttons">
<button id="routeBtn">🛣️ Построить маршрут</button>
<button id="clearBtn" class="secondary">Очистить</button>
<button id="locateBtn" class="secondary">📍 Моё положение</button>
</div>
<div id="status">Нажмите карту: первая точка — «Откуда», вторая — «Куда».</div>
<div id="routeInfo"></div>
</section>
<div id="map"></div>
</main>
<script>window.TULPAR_2GIS_KEY="d771d962-3726-43ba-bf11-e82ed12d3085";</script>
<script src="app.js"></script>
</body>
</html>
